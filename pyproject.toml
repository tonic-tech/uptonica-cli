[project]
name = "uptonica"
version = "0.2.0"
description = "Uptonica command-line client — one binary, scope decided server-side by your token."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Uptonica", email = "support@uptonica.com" }]
dependencies = [
    "prompt_toolkit>=3.0.43,<4.0",
    "rich>=13.0,<15.0",
    # rich's own floor (pygments>=2.13.0) resolves to a version with
    # CVE-2022-40896 (ReDoS in Pygments lexers) on a constrained install.
    # Reachable, not theoretical: rich.markdown.Markdown renders fenced code
    # blocks through pygments, and what's being lexed there is the model's
    # own reply — text ultimately derived from tenant data, not this CLI's.
    "pygments>=2.15.0",
]

[project.urls]
Homepage = "https://uptonica.com"
Documentation = "https://github.com/tonic-tech/uptonica-cli"

[project.scripts]
uptonica = "uptonica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uptonica"]
